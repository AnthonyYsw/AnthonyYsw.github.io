# Site identity
url: "https://AnthonyYsw.github.io"
baseurl: ""
title: "Siwei Yang"
header_title: "Anthony"
description: Anthony's Original Blog
copyright_years: "2025-2026"
date_format: "%d %B %Y"

# Language and build settings
lang: en_GB

theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep maintenance documentation out of the published site.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
